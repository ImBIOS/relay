name: Relay QA

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".relay/**"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - ".relay/**"
  workflow_dispatch:
    inputs:
      feature:
        description: "Run QA for a specific feature (e.g., '001-proxy'), or 'all' for all"
        required: false
        default: "all"

permissions:
  contents: read

jobs:
  validate-patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            bun install
          fi
      - name: Validate all patches
        run: |
          if command -v relay &>/dev/null; then
            RELAY_CMD="relay"
          elif [ -f src/run.ts ]; then
            RELAY_CMD="bun src/run.ts"
          else
            RELAY_CMD="bun run relay"
          fi

          $RELAY_CMD patch validate --strict

  validate-specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate feature specs
        run: |
          if [ ! -d .relay/features ]; then
            echo "No .relay/features directory found."
            exit 0
          fi

          MISSING=0
          ERRORS=0

          for dir in .relay/features/*/; do
            NAME=$(basename "$dir")
            SPEC="${dir}spec.md"
            QA="${dir}qa.md"
            PATCH="${dir}patch.md"

            if [ ! -f "$SPEC" ]; then
              echo "MISSING: ${NAME}/spec.md"
              MISSING=$((MISSING + 1))
            else
              # Check required sections
              for SECTION in "Overview" "Requirements" "Acceptance Criteria"; do
                if ! grep -q "## $SECTION" "$SPEC"; then
                  echo "ERROR: $SPEC missing '## $SECTION' section"
                  ERRORS=$((ERRORS + 1))
                fi
              done

              # Check status frontmatter
              if ! head -5 "$SPEC" | grep -q "Status:"; then
                echo "ERROR: $SPEC missing Status frontmatter"
                ERRORS=$((ERRORS + 1))
              fi
            fi

            if [ ! -f "$QA" ]; then
              echo "MISSING: ${NAME}/qa.md"
              MISSING=$((MISSING + 1))
            fi

            # If patch.md exists, validate required sections
            if [ -f "$PATCH" ]; then
              if ! grep -q "## Intent" "$PATCH"; then
                echo "ERROR: $PATCH missing '## Intent' section"
                ERRORS=$((ERRORS + 1))
              fi
              if ! grep -q "## Reconciliation Notes" "$PATCH"; then
                echo "WARN: $PATCH missing '## Reconciliation Notes' section (recommended)"
              fi
            fi
          done

          if [ $MISSING -gt 0 ]; then
            echo "::warning::$MISSING missing doc(s) in feature folders"
          fi
          if [ $ERRORS -gt 0 ]; then
            echo "::error::$ERRORS spec format error(s) found"
            exit 1
          fi

          echo "All specs pass format validation."

  run-tests:
    runs-on: ubuntu-latest
    needs: validate-patches
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Run tests
        run: bun test
