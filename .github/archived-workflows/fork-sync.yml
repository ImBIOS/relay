name: Fork Sync

on:
  workflow_dispatch:
    inputs:
      upstream-ref:
        description: "Upstream ref to sync to (branch, tag, or commit)"
        required: false
        default: ""
  schedule:
    # Run daily at 6:00 UTC
    - cron: "0 6 * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check-fork:
    runs-on: ubuntu-latest
    outputs:
      is-fork: ${{ steps.check.outputs.is-fork }}
      upstream: ${{ steps.check.outputs.upstream }}
    steps:
      - name: Check if this is a fork
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IS_FORK=$(gh repo view --json isFork -q '.isFork')
          echo "is-fork=$IS_FORK" >> "$GITHUB_OUTPUT"

          if [ "$IS_FORK" = "true" ]; then
            PARENT=$(gh repo view --json parent -q '.parent.owner.login + "/" + .parent.name')
            echo "upstream=$PARENT" >> "$GITHUB_OUTPUT"
            echo "This is a fork. Upstream: $PARENT"
          else
            echo "This is not a fork."
          fi

  read-config:
    runs-on: ubuntu-latest
    needs: check-fork
    if: needs.check-fork.outputs.is-fork == 'true' || true
    outputs:
      enabled: ${{ steps.config.outputs.enabled }}
      upstream: ${{ steps.config.outputs.upstream }}
      upstream-branch: ${{ steps.config.outputs.upstream-branch }}
      conflict-strategy: ${{ steps.config.outputs.conflict-strategy }}
      reapply-patches: ${{ steps.config.outputs.reapply-patches }}
      manage-issues: ${{ steps.config.outputs.manage-issues }}
      create-prs: ${{ steps.config.outputs.create-prs }}
      ai-reapply: ${{ steps.config.outputs.ai-reapply }}
    steps:
      - uses: actions/checkout@v4
      - name: Read upstream config
        id: config
        run: |
          if [ ! -f .relay/upstream.json ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No .relay/upstream.json found. Fork sync is disabled."
            exit 0
          fi

          ENABLED=$(jq -r '.enabled // false' .relay/upstream.json)
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"

          if [ "$ENABLED" != "true" ]; then
            echo "Fork sync is disabled in .relay/upstream.json"
            exit 0
          fi

          # Support explicit upstream field for non-fork repos
          CONFIG_UPSTREAM=$(jq -r '.upstream // empty' .relay/upstream.json)
          DETECTED_UPSTREAM="${{ needs.check-fork.outputs.upstream }}"
          FINAL_UPSTREAM="${CONFIG_UPSTREAM:-$DETECTED_UPSTREAM}"
          echo "upstream=$FINAL_UPSTREAM" >> "$GITHUB_OUTPUT"

          echo "upstream-branch=$(jq -r '.upstreamBranch // "main"' .relay/upstream.json)" >> "$GITHUB_OUTPUT"
          echo "conflict-strategy=$(jq -r '.conflictStrategy // "attempt-rebase"' .relay/upstream.json)" >> "$GITHUB_OUTPUT"
          echo "reapply-patches=$(jq -r '.reapplyPatches // true' .relay/upstream.json)" >> "$GITHUB_OUTPUT"
          echo "manage-issues=$(jq -r '.manageUpstreamIssues // true' .relay/upstream.json)" >> "$GITHUB_OUTPUT"
          echo "create-prs=$(jq -r '.createUpstreamPRs // true' .relay/upstream.json)" >> "$GITHUB_OUTPUT"
          echo "ai-reapply=$(jq -r '.aiReapply // true' .relay/upstream.json)" >> "$GITHUB_OUTPUT"

  sync:
    runs-on: ubuntu-latest
    needs: [check-fork, read-config]
    if: needs.read-config.outputs.enabled == 'true'
    outputs:
      has_changes: ${{ steps.merge.outputs.has_changes }}
      has_conflicts: ${{ steps.merge.outputs.has_conflicts }}
      behind: ${{ steps.fetch.outputs.behind }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "fork-sync[bot]"
          git config user.email "fork-sync[bot]@users.noreply.github.com"

      - name: Fetch upstream
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM="${{ needs.read-config.outputs.upstream }}"
          BRANCH="${{ needs.read-config.outputs.upstream-branch }}"
          REF="${{ github.event.inputs.upstream-ref || format('refs/heads/{0}', BRANCH) }}"

          if [ -z "$UPSTREAM" ]; then
            echo "No upstream configured. Skipping sync."
            echo "has_changes=false" >> "$GITHUB_ENV"
            exit 0
          fi

          git remote add upstream "https://github.com/${UPSTREAM}.git" || true
          git fetch upstream

          LOCAL=$(git rev-parse HEAD)
          UPSTREAM_COMMIT=$(git rev-parse "$REF" 2>/dev/null || echo "")
          BEHIND=$(git rev-list HEAD.."$REF" --count 2>/dev/null || echo "0")

          echo "local=$LOCAL" >> "$GITHUB_ENV"
          echo "upstream_commit=$UPSTREAM_COMMIT" >> "$GITHUB_ENV"
          echo "behind=$BEHIND" >> "$GITHUB_ENV"
          echo "ref=$REF" >> "$GITHUB_ENV"

          if [ "$BEHIND" -eq 0 ]; then
            echo "Already up to date with upstream."
            echo "has_changes=false" >> "$GITHUB_ENV"
          else
            echo "Behind upstream by $BEHIND commits."
            echo "has_changes=true" >> "$GITHUB_ENV"
          fi

      - name: Merge upstream
        id: merge
        if: env.has_changes == 'true'
        env:
          STRATEGY: ${{ needs.read-config.outputs.conflict-strategy }}
        run: |
          SYNC_BRANCH="sync/upstream-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$SYNC_BRANCH"

          HAS_CONFLICTS="false"

          if [ "$STRATEGY" = "attempt-rebase" ]; then
            git rebase "${{ env.ref }}" || {
              echo "Rebase conflicts detected. Attempting merge..."
              git rebase --abort
              git merge "${{ env.ref }}" --no-edit || {
                echo "Merge conflicts detected."
                HAS_CONFLICTS="true"
                git diff --name-only --diff-filter=U | head -20
              }
            }
          else
            git merge "${{ env.ref }}" --no-edit || {
              if [ "$STRATEGY" = "fail" ]; then
                echo "ERROR: Merge conflict detected and conflict strategy is 'fail'."
                exit 1
              else
                echo "WARNING: Merge conflict detected."
                HAS_CONFLICTS="true"
              fi
            }
          fi

          echo "has_conflicts=$HAS_CONFLICTS" >> "$GITHUB_OUTPUT"
          git push origin "$SYNC_BRANCH"
          echo "sync_branch=$SYNC_BRANCH" >> "$GITHUB_ENV"

      - name: Create sync PR with health report
        if: env.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BEHIND="${{ env.behind }}"
          UPSTREAM_COMMIT="${{ env.upstream_commit }}"
          SYNC_BRANCH="${{ env.sync_branch }}"
          HAS_CONFLICTS="${{ steps.merge.outputs.has_conflicts }}"

          # Build conflict section
          CONFLICT_SECTION=""
          if [ "$HAS_CONFLICTS" = "true" ]; then
            CONFLICT_FILES=$(git diff --name-only --diff-filter=U 2>/dev/null || echo "unknown")
            CONFLICT_SECTION="

          ### Conflicts Detected

          The following files have conflicts that need resolution:
          \`\`\`
          ${CONFLICT_FILES}
          \`\`\`

          The Relay Patch workflow will attempt to re-apply patches after merge."
          fi

          # Build patch summary
          PATCH_SUMMARY=""
          if [ -f .relay/registry.json ]; then
            ACTIVE=$(jq '[.features[] | select(.status=="active" and .hasPatch==true)] | length' .relay/registry.json 2>/dev/null || echo "0")
            RETIRED=$(jq '[.features[] | select(.status=="retired")] | length' .relay/registry.json 2>/dev/null || echo "0")
            CONFLICTED=$(jq '[.features[] | select(.status=="conflicted")] | length' .relay/registry.json 2>/dev/null || echo "0")
            HEALTH=$(jq -r '.forkHealthScore // "N/A"' .relay/registry.json 2>/dev/null || echo "N/A")
            PATCH_SUMMARY="

          ### Patch Health Dashboard

          | Metric | Value |
          |--------|-------|
          | Active patches | ${ACTIVE} |
          | Retired patches | ${RETIRED} |
          | Conflicted patches | ${CONFLICTED} |
          | Health score | ${HEALTH}/100 |"
          fi

          gh pr create \
            --title "sync: upstream ${UPSTREAM_COMMIT:0:7} ($BEHIND commits)" \
            --body "Automated sync with upstream.

          - **Upstream commit**: ${UPSTREAM_COMMIT}
          - **Commits behind**: ${BEHIND}
          - **Sync branch**: ${SYNC_BRANCH}
          - **Conflicts**: ${HAS_CONFLICTS}

          After this PR is merged, the Relay Patch workflow will re-apply any active patches.${CONFLICT_SECTION}${PATCH_SUMMARY}" \
            --base "${{ github.ref_name }}" \
            --head "$SYNC_BRANCH" \
            --label "automated,fork-sync" || true

      - name: Manage upstream issues and PRs
        if: needs.read-config.outputs.manage-issues == 'true' && env.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CREATE_PRS: ${{ needs.read-config.outputs.create-prs }}
        run: |
          UPSTREAM="${{ needs.read-config.outputs.upstream }}"

          if [ ! -f .relay/registry.json ]; then
            echo "No feature registry found."
            exit 0
          fi

          PATCHED_FEATURES=$(jq -r '.features[] | select(.hasPatch==true) | "\(.id)-\(.slug)"' .relay/registry.json)

          for FEATURE in $PATCHED_FEATURES; do
            FEATURE_ID=$(echo "$FEATURE" | grep -o '^[0-9]*')
            PATCH_FILE=".relay/features/${FEATURE}/patch.md"

            UPSTREAM_ISSUE=$(jq -r --arg id "$FEATURE_ID" \
              '.features[] | select(.id==$id) | .upstreamIssue // empty' \
              .relay/registry.json)

            if [ -z "$UPSTREAM_ISSUE" ]; then
              echo "Feature $FEATURE has a patch but no upstream issue. Creating one..."

              if [ -f "$PATCH_FILE" ]; then
                INTENT=$(awk '/^## Intent$/,/^## [^I]/' "$PATCH_FILE" | head -n -1 | tail -n +2 | tr '\n' ' ' | cut -c1-500)
              else
                INTENT="See .relay/features/${FEATURE}/patch.md in the fork for details."
              fi

              ISSUE_URL=$(gh issue create \
                --repo "$UPSTREAM" \
                --title "[Fork Patch] ${FEATURE}" \
                --body "This feature request originates from a fork customization.

          **Fork**: ${{ github.repository }}
          **Feature**: ${FEATURE}

          ## Intent

          ${INTENT}

          ---
          *This issue is managed by the Relay fork-sync workflow.*" \
                --label "enhancement,from-fork" 2>&1 || echo "Failed to create issue")

              if echo "$ISSUE_URL" | grep -q "https://"; then
                echo "Created upstream issue: $ISSUE_URL"
                jq --arg id "$FEATURE_ID" --arg url "$ISSUE_URL" \
                  '(.features[] | select(.id==$id)).upstreamIssue = $url' \
                  .relay/registry.json > .relay/registry.tmp.json
                mv .relay/registry.tmp.json .relay/registry.json

                # Optionally create a PR with the patch diff
                if [ "$CREATE_PRS" = "true" ] && [ -f "$PATCH_FILE" ]; then
                  echo "Creating upstream PR for $FEATURE..."

                  BRANCH_NAME="fork-patch/${FEATURE}"
                  git checkout -b "$BRANCH_NAME" 2>/dev/null || true
                  git push origin "$BRANCH_NAME" 2>/dev/null || true

                  PR_URL=$(gh pr create \
                    --repo "$UPSTREAM" \
                    --head "${{ github.repository_owner }}:${BRANCH_NAME}" \
                    --title "[Fork Patch] ${FEATURE}" \
                    --body "Implements feature from fork patch.

          **Fork**: ${{ github.repository }}
          **Feature**: ${FEATURE}

          ## Intent

          ${INTENT}

          ---
          *This PR is managed by the Relay fork-sync workflow.*" \
                    2>&1 || echo "Failed to create PR (may need fork permissions)")

                  if echo "$PR_URL" | grep -q "https://"; then
                    echo "Created upstream PR: $PR_URL"
                    jq --arg id "$FEATURE_ID" --arg url "$PR_URL" \
                      '(.features[] | select(.id==$id)).upstreamPR = $url' \
                      .relay/registry.json > .relay/registry.tmp.json
                    mv .relay/registry.tmp.json .relay/registry.json
                  fi

                  git checkout - 2>/dev/null || true
                fi
              fi
            else
              echo "Feature $FEATURE tracked in upstream issue: $UPSTREAM_ISSUE"
              STATE=$(gh issue view "$UPSTREAM_ISSUE" --repo "$UPSTREAM" --json state -q '.state' 2>/dev/null || echo "unknown")
              if [ "$STATE" = "CLOSED" ]; then
                echo "Upstream issue $UPSTREAM_ISSUE is closed. Consider running check-merged."
              fi
            fi
          done

      - name: Commit registry updates
        if: needs.read-config.outputs.manage-issues == 'true'
        run: |
          git add .relay/registry.json
          git diff --cached --quiet || git commit -m "chore: update feature registry with upstream issue refs [skip ci]"
          git push

  trigger-patches:
    runs-on: ubuntu-latest
    needs: [read-config, sync]
    if: needs.read-config.outputs.reapply-patches == 'true' && needs.sync.outputs.has_changes == 'true'
    steps:
      - name: Trigger Relay Patch workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering Relay Patch workflow to re-apply patches after sync..."
          gh workflow run relay-patch.yml --field feature=all || echo "Could not trigger patch workflow"

  conflict-report:
    runs-on: ubuntu-latest
    needs: [read-config, sync]
    if: needs.sync.outputs.has_conflicts == 'true'
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Create conflict report issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONFLICT_FILES=$(git diff --name-only --diff-filter=U 2>/dev/null || echo "unknown")

          EXISTING=$(gh issue list --label "conflict,automated" --state open --json number -q '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            echo "Updating existing conflict issue #$EXISTING"
            gh issue comment "$EXISTING" --body "New conflicts detected on $(date -u +%Y-%m-%dT%H:%M:%SZ):

          \`\`\`
          ${CONFLICT_FILES}
          \`\`\`" || true
          else
            gh issue create \
              --title "Sync conflicts detected ($(date +%Y-%m-%d))" \
              --body "Automated conflict report from fork-sync workflow.

          ## Conflicted Files

          \`\`\`
          ${CONFLICT_FILES}
          \`\`\`

          ## Next Steps

          1. Review the conflicts
          2. Run \`relay patch apply\` to re-apply patches
          3. Or manually resolve conflicts

          ---
          *This issue is managed by the Relay fork-sync workflow.*" \
              --label "conflict,automated" || true
          fi
