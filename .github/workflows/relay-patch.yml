name: Relay Patch

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: false
        default: "apply"
        type: choice
        options:
          - apply
          - check-merged
          - analyze
      feature:
        description: "Feature slug to apply patch for (e.g., '001-proxy'), or 'all' for all features with patch.md"
        required: false
        default: "all"
      dry-run:
        description: "Dry run (show what would be applied without making changes)"
        type: boolean
        default: false
  schedule:
    # Run daily at 7:00 UTC (after fork-sync if scheduled)
    - cron: "0 7 * * *"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apply-patches:
    if: github.event.inputs.action == 'apply' || github.event.inputs.action == '' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            bun install
          fi

      - name: Find features with patches
        id: features
        run: |
          FEATURES=""
          if [ -d .relay/features ]; then
            for dir in .relay/features/*/; do
              if [ -f "${dir}patch.md" ]; then
                NAME=$(basename "$dir")
                FEATURES="$FEATURES $NAME"
              fi
            done
          fi

          echo "features=$FEATURES" >> "$GITHUB_OUTPUT"
          echo "Features with patches:$FEATURES"

      - name: Read AI config
        id: ai-config
        run: |
          if [ -f .relay/upstream.json ]; then
            echo "ai-reapply=$(jq -r '.aiReapply // true' .relay/upstream.json)" >> "$GITHUB_OUTPUT"
            echo "ai-model=$(jq -r '.aiModel // "claude-sonnet-4-20250514"' .relay/upstream.json)" >> "$GITHUB_OUTPUT"
            echo "ai-max-turns=$(jq -r '.aiMaxTurns // 30' .relay/upstream.json)" >> "$GITHUB_OUTPUT"
          else
            echo "ai-reapply=true" >> "$GITHUB_OUTPUT"
            echo "ai-model=claude-sonnet-4-20250514" >> "$GITHUB_OUTPUT"
            echo "ai-max-turns=30" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply patches with AI
        if: steps.ai-config.outputs.ai-reapply == 'true'
        env:
          TARGET: ${{ github.event.inputs.feature || 'all' }}
          DRY_RUN: ${{ github.event.inputs.dry-run || 'false' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "=== Relay Patch (AI-powered) ==="
          echo "Target: $TARGET"
          echo "Dry run: $DRY_RUN"
          echo ""

          if [ "$TARGET" = "all" ]; then
            FEATURES="${{ steps.features.outputs.features }}"
          else
            FEATURES="$TARGET"
          fi

          if [ -z "$FEATURES" ]; then
            echo "No features with patches to apply."
            exit 0
          fi

          # Use relay CLI if available, otherwise use bun directly
          if command -v relay &>/dev/null; then
            RELAY_CMD="relay"
          elif [ -f src/run.ts ]; then
            RELAY_CMD="bun src/run.ts"
          else
            RELAY_CMD="bun run relay"
          fi

          if [ "$DRY_RUN" = "true" ]; then
            $RELAY_CMD patch apply --feature "$TARGET" --dry-run
          else
            $RELAY_CMD patch apply --feature "$TARGET"
          fi

      - name: Apply patches (no AI)
        if: steps.ai-config.outputs.ai-reapply != 'true'
        env:
          TARGET: ${{ github.event.inputs.feature || 'all' }}
          DRY_RUN: ${{ github.event.inputs.dry-run || 'false' }}
        run: |
          echo "=== Relay Patch (no AI) ==="
          echo "Target: $TARGET"
          echo "Dry run: $DRY_RUN"
          echo ""

          if [ "$TARGET" = "all" ]; then
            FEATURES="${{ steps.features.outputs.features }}"
          else
            FEATURES="$TARGET"
          fi

          if [ -z "$FEATURES" ]; then
            echo "No features with patches to apply."
            exit 0
          fi

          if command -v relay &>/dev/null; then
            RELAY_CMD="relay"
          elif [ -f src/run.ts ]; then
            RELAY_CMD="bun src/run.ts"
          else
            RELAY_CMD="bun run relay"
          fi

          $RELAY_CMD patch apply --feature "$TARGET" --no-ai

      - name: Commit changes
        if: github.event.inputs.dry-run != 'true'
        run: |
          git config user.name "relay-patch[bot]"
          git config user.email "relay-patch[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: apply relay patches [skip ci]"
          git push

      - name: Generate health report
        if: always()
        run: |
          echo "## Patch Health Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f .relay/registry.json ]; then
            ACTIVE=$(jq '[.features[] | select(.status=="active" and .hasPatch==true)] | length' .relay/registry.json 2>/dev/null || echo "0")
            RETIRED=$(jq '[.features[] | select(.status=="retired")] | length' .relay/registry.json 2>/dev/null || echo "0")
            CONFLICTED=$(jq '[.features[] | select(.status=="conflicted")] | length' .relay/registry.json 2>/dev/null || echo "0")
            LAST_APPLY=$(jq -r '.lastPatchApply // "never"' .relay/registry.json 2>/dev/null || echo "never")

            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Active patches | ${ACTIVE} |" >> $GITHUB_STEP_SUMMARY
            echo "| Retired patches | ${RETIRED} |" >> $GITHUB_STEP_SUMMARY
            echo "| Conflicted | ${CONFLICTED} |" >> $GITHUB_STEP_SUMMARY
            echo "| Last apply | ${LAST_APPLY} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "No registry found." >> $GITHUB_STEP_SUMMARY
          fi

  check-merged:
    if: github.event.inputs.action == 'check-merged'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            bun install
          fi

      - name: Check upstream merge status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if command -v relay &>/dev/null; then
            RELAY_CMD="relay"
          elif [ -f src/run.ts ]; then
            RELAY_CMD="bun src/run.ts"
          else
            RELAY_CMD="bun run relay"
          fi

          $RELAY_CMD patch check-merged

      - name: Commit and push changes
        run: |
          git config user.name "relay-patch[bot]"
          git config user.email "relay-patch[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: clean up merged upstream patches [skip ci]"
          git push

  analyze:
    if: github.event.inputs.action == 'analyze'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            bun install
          fi

      - name: Run fork analysis
        run: |
          if command -v relay &>/dev/null; then
            RELAY_CMD="relay"
          elif [ -f src/run.ts ]; then
            RELAY_CMD="bun src/run.ts"
          else
            RELAY_CMD="bun run relay"
          fi

          $RELAY_CMD patch analyze --save

      - name: Commit analysis
        run: |
          git config user.name "relay-patch[bot]"
          git config user.email "relay-patch[bot]@users.noreply.github.com"
          git add .relay/registry.json
          git diff --cached --quiet || git commit -m "chore: update fork health analysis [skip ci]"
          git push
